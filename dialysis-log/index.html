<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dialysis Log Tracker — HD & Water Plant</title>
<meta name="description" content="Machine disinfection, preventive maintenance, and water culture logs for hemodialysis and RO water plant equipment. Lookup by machine, AAMI action-level flags, audit-ready exports.">
<style>
  :root{
    --navy:#0a2c4e;--navy-2:#0f3a66;--ink:#1c2933;--muted:#5a6570;
    --bg:#f4f6f8;--card:#fff;--border:#dde4ea;
    --teal:#0e7c86;--teal-soft:#e3f2f4;
    --gold:#ffb020;--gold-soft:#fff8e6;
    --red:#c0392b;--red-soft:#fdecea;
    --green:#2e7d43;--green-soft:#e8f5e9;
    --gray-soft:#eef1f4;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:16px}
  header{background:linear-gradient(160deg,var(--navy) 0%,var(--navy-2) 100%);color:#fff;padding:20px 16px;position:sticky;top:0;z-index:10}
  header h1{margin:0;font-size:19px;font-weight:700;letter-spacing:.2px}
  header p{margin:4px 0 0;font-size:13px;opacity:.85}
  main{max-width:860px;margin:0 auto;padding:16px 12px 80px}
  .tabs{display:flex;gap:8px;margin:0 0 14px;flex-wrap:wrap}
  .tabs button{flex:1 1 auto;min-width:110px;padding:10px 8px;border:1px solid var(--border);border-radius:10px;background:var(--card);font-size:14px;font-weight:600;color:var(--muted);cursor:pointer}
  .tabs button.active{background:var(--navy);color:#fff;border-color:var(--navy)}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
  .card h2{margin:0 0 12px;font-size:16px}
  .muted{color:var(--muted);font-size:13px}
  /* machine rows */
  .mrow{display:flex;align-items:center;gap:12px;padding:12px 10px;border-bottom:1px solid var(--border);cursor:pointer}
  .mrow:last-child{border-bottom:none}
  .mrow .id{font-weight:800;font-size:15px;min-width:64px}
  .mrow:hover{background:var(--gray-soft)}
  .badge{padding:3px 10px;border-radius:14px;font-size:11px;font-weight:700;letter-spacing:.4px;white-space:nowrap}
  .badge.ok{background:var(--green-soft);color:var(--green)}
  .badge.due{background:var(--gold-soft);color:#8a6400}
  .badge.overdue{background:var(--red-soft);color:var(--red)}
  .badge.type{background:var(--teal-soft);color:var(--teal)}
  /* forms */
  label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:12px 0 4px;letter-spacing:.3px}
  select,input[type="text"],input[type="date"],input[type="number"],input[type="time"],textarea{
    width:100%;padding:11px;border:1px solid var(--border);border-radius:9px;font-size:16px;background:#fff;color:var(--ink)}
  textarea{min-height:70px;resize:vertical}
  .btn{width:100%;padding:13px;border:none;border-radius:10px;background:var(--teal);color:#fff;font-size:16px;font-weight:700;cursor:pointer;margin-top:16px}
  .btn:active{opacity:.85}
  .btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--border)}
  .btn.danger{background:var(--red)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  /* timeline */
  .ev{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
  .ev:last-child{border:none}
  .ev .icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;background:var(--gray-soft)}
  .ev .icon.pass{background:var(--green-soft)}
  .ev .icon.fail{background:var(--red-soft)}
  .ev .body{flex:1}
  .ev .who{font-size:11px;color:var(--muted)}
  /* AAMI flag */
  .flag{background:var(--red-soft);border-left:4px solid var(--red);padding:10px 12px;border-radius:8px;margin:8px 0;font-size:14px}
  .flag.warn{background:var(--gold-soft);border-left-color:var(--gold)}
  .okmsg{background:var(--green-soft);border-left:4px solid var(--green);padding:10px 12px;border-radius:8px;margin:8px 0;font-size:14px}
  .hidden{display:none}
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
  .kpi{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center}
  .kpi .n{font-size:24px;font-weight:800}
  .kpi .l{font-size:11px;color:var(--muted);font-weight:600}
  footer{padding:26px 16px;text-align:center;font-size:12px;color:var(--muted)}
  @media(min-width:720px){.row2{grid-template-columns:1fr 1fr 1fr}}
</style>
</head>
<body>
<header>
  <h1>Dialysis & Water Plant Logs</h1>
  <p>HD machines · WRO · disinfection, PM, cultures</p>
</header>
<main>
  <div class="tabs">
    <button id="tab-dash" class="active" onclick="show('dash')">Board</button>
    <button id="tab-log" onclick="show('log')">Log entry</button>
    <button id="tab-mch" onclick="show('mch')">Machines</button>
  </div>

  <!-- ============================== BOARD ============================== -->
  <section id="view-dash">
    <div class="card" id="aamiCard"></div>
    <div class="kpis" id="kpis"></div>
    <div class="card"><h2>Overdue & due</h2><div id="dueList" class="muted">Loading…</div></div>
    <div class="card"><h2>Recent events &amp; audit export</h2><div class="row2" style="margin-bottom:10px"><div><label for="xFrom">Export from</label><input type="date" id="xFrom"></div><div><label for="xTo">to</label><input type="date" id="xTo"></div></div><button class="btn ghost" onclick="exportCSV()">Download audit CSV (this range)</button><label for="recentFilter" style="margin-top:14px">Filter by machine</label><select id="recentFilter" onchange="renderRecent()" style="max-width:320px"></select><div id="recentList" class="muted" style="margin-top:12px">Loading…</div></div>
  </section>

  <!-- ============================== LOG ENTRY ========================== -->
  <section id="view-log" class="hidden">
    <div class="card">
      <h2>New log entry</h2>
      <label for="fMachine">Machine</label>
      <select id="fMachine"></select>
      <label for="fTask">Task</label>
      <select id="fTask"></select>
      <div class="row2">
        <div><label for="fDate">Date</label><input type="date" id="fDate"></div>
        <div><label for="fTime">Time</label><input type="time" id="fTime"></div>
      </div>
      <div class="row2" id="dynFields"></div>
      <label for="fBy">Performed by</label>
      <input type="text" id="fBy" placeholder="Initials (JG, OL…)" maxlength="12">
      <label for="fNotes">Notes</label>
      <textarea id="fNotes" placeholder="Optional"></textarea>
      <button class="btn" onclick="submitEvent()">Save entry</button>
      <p class="muted" id="logMsg" style="margin:10px 0 0"></p>
    </div>
  </section>

  <!-- ============================== MACHINES =========================== -->
  <section id="view-mch" class="hidden">
    <div class="card">
      <h2>Add machine</h2>
      <div class="row2">
        <div><label for="mType">Type</label>
          <select id="mType"><option value="HD">HD (in-center)</option><option value="WRO">WRO (water plant)</option><option value="CRRT">CRRT (Prismaflex/Prismax)</option><option value="NXSTAGE">NxStage System One</option><option value="CCPD">CCPD (PD cycler)</option></select></div>
        <div><label for="mLabel">ID / label</label><input type="text" id="mLabel" placeholder="#7 or RO skid" maxlength="24"></div>
      </div>
      <div class="row2">
        <div><label for="mModel">Model</label><input type="text" id="mModel" placeholder="2008K, Nikkiso…" maxlength="40"></div>
        <div><label for="mLoc">Location</label><input type="text" id="mLoc" placeholder="Bay 2 / Water room" maxlength="40"></div>
      </div>
      <button class="btn ghost" onclick="addMachine()">Add machine</button>
      <p class="muted" id="mchMsg" style="margin:10px 0 0"></p>
    </div>
    <div class="card"><h2>Machines</h2><div id="machineList" class="muted">Loading…</div></div>
  </section>

  <!-- ============================== MACHINE DETAIL ===================== -->
  <section id="view-detail" class="hidden"></section>
</main>
<footer>Runs locally in your browser · data via your own Supabase project · free hosting</footer>

<script>
/* ================= CONFIG (anon key — public by design; RLS-off) ============ */
const SB_URL  = "https://ymvaslldugwzgjeaxabz.supabase.co";
const SB_KEY  = "sb_publishable_EpbSQ2PEnEzOxAPkzkCe1g__Y0ozzi9";
const API = {
  machines: SB_URL + "/rest/v1/dl_machines",
  templates:SB_URL + "/rest/v1/dl_task_templates",
  events:   SB_URL + "/rest/v1/dl_events",
  actions:  SB_URL + "/rest/v1/dl_actions",
};
function h(extra){ return Object.assign(
  {"apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY,"Content-Type":"application/json",
   "Prefer":"return=representation"}, extra||{}); }
async function apiGet(url){ const r = await fetch(url,{headers:h()});
  if(!r.ok) throw new Error(r.status+" "+await r.text()); return r.json(); }
async function apiPost(url,obj){ const r = await fetch(url,{method:"POST",headers:h(),body:JSON.stringify(obj)});
  if(!r.ok) throw new Error(r.status+" "+await r.text()); return r.json(); }
async function apiPatch(url,obj){ const r = await fetch(url,{method:"PATCH",headers:h(),body:JSON.stringify(obj)});
  if(!r.ok) throw new Error(r.status+" "+await r.text()); return r.json(); }

/* ================= AAMI ACTION LEVELS ======================== */
const AAMI = { CFU_ACTION:50, CFU_LIMIT:100, EU_ACTION:0.125, EU_LIMIT:0.25, COND_LIMIT:10 };

/* ================= STATE ======================== */
let MACHINES=[], TEMPLATES=[], EVENTS=[], ACTIONS=[];
let currentMachine=null;

/* ================= NAVIGATION ======================== */
function show(v){ for(const x of ["dash","log","mch","detail"]){
    document.getElementById("view-"+x).classList.toggle("hidden",x!==v);
    const b=document.getElementById("tab-"+x); if(b) b.classList.toggle("active",x===v);}
  if(v==="dash") renderDash();
  if(v==="log") renderLogForm();
  if(v==="mch") renderMachines();
  if(v==="detail") renderDetail();
}

function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
  .replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }

/* ================= DATA LOAD ======================== */
async function loadAll(){
  const rows = (id)=>apiGet(API[id]+"?select=*&order=id.desc&limit=2000");
  [MACHINES,TEMPLATES,EVENTS,ACTIONS] = await Promise.all([
    apiGet(API.machines+"?select=*&active=eq.true&order=label"),
    apiGet(API.templates+"?select=*&order=task_type"),
    rows("events"), rows("actions")]);
}

/* ============== DUE-STATE ENGINE — per machine + template ==========
   A task's state = interval clock from the most recent matching event. */
function daysSince(ds){ return Math.floor((Date.now() - new Date(ds+"T12:00:00"))/86400000); }
function lastEvent(machineId, taskType){
  const ev = EVENTS.filter(e=>e.machine_id===machineId && e.task_type===taskType)
    .sort((a,b)=> b.event_date.localeCompare(a.event_date))[0];
  return ev||null;
}
function machineState(m){
  const tpls = TEMPLATES.filter(t=>t.machine_type===m.type && t.interval_days);
  let worst = {level:"ok", label:"All current", task:null, days:0};
  for(const tp of tpls){
    const ev = lastEvent(m.id, tp.task_type);
    const last = ev ? ev.event_date : null;
    const age = last ? daysSince(last) : null;
    // never-logged tasks count as overdue from the day the machine was added
    const created = (m.created_at||"").slice(0,10);
    const anchor = last || (created || null);
    if(!anchor){ continue; }               // no anchor (fresh machine, no date): skip
    const over = (last ? age : daysSince(created)) - (tp.interval_days||1) + 1;
    let lvl = "ok";
    if(over > 0) lvl = (over >= 3) ? "overdue" : "due";
    const displayDays = last ? Math.max(0, over) : Math.max(0, daysSince(created) - tp.interval_days + 1);
    if(lvl==="overdue" || (lvl==="due" && worst.level==="ok"))
      worst = {level:lvl, label:tp.label, task:tp.task_type, days:displayDays};
  }
  return worst;
}

/* ============== AAMI ENGINE (cultures + conductivity) =============== */
function aamiFindings(){
  const out = [];
  for(const e of EVENTS){
    const v = e.values||{};
    const m = MACHINES.find(x=>x.id===e.machine_id);
    const who = m? m.label : "?";
    if(v.cfu_ml!=null){
      if(v.cfu_ml > AAMI.CFU_LIMIT)
        out.push({sev:"breach", msg:`${who} water culture ${e.event_date}: ${v.cfu_ml} CFU/mL — ABOVE LIMIT ${AAMI.CFU_LIMIT}. Disinfect within 24h + re-culture.`, event:e});
      else if(v.cfu_ml > AAMI.CFU_ACTION)
        out.push({sev:"warn", msg:`${who} water culture ${e.event_date}: ${v.cfu_ml} CFU/mL — ACTION LEVEL (${AAMI.CFU_ACTION}). Plan disinfect + re-culture.`, event:e});
    }
    if(v.eu_ml!=null){
      if(v.eu_ml > AAMI.EU_LIMIT)
        out.push({sev:"breach", msg:`${who} endotoxin ${e.event_date}: ${v.eu_ml} EU/mL — ABOVE LIMIT ${AAMI.EU_LIMIT}.`, event:e});
      else if(v.eu_ml > AAMI.EU_ACTION)
        out.push({sev:"warn", msg:`${who} endotoxin ${e.event_date}: ${v.eu_ml} EU/mL — ACTION LEVEL (${AAMI.EU_ACTION}).`, event:e});
    }
    if(v.conductivity_uS!=null && v.conductivity_uS > AAMI.COND_LIMIT){
      out.push({sev:"breach", msg:`${who} conductivity ${e.event_date}: ${v.conductivity_uS} µS/cm — ABOVE ${AAMI.COND_LIMIT}. Check membrane/softener.`, event:e});
    }
  }
  return out;
}

/* ================= DASHBOARD (board) ======================== */
function renderDash(){
  const flags = aamiFindings();
  const ac = document.getElementById("aamiCard");
  if(flags.length === 0){
    ac.innerHTML = '<h2>Water quality</h2><div class="okmsg">No culture or conductivity breaches on record. All values inside action levels.</div>';
  } else {
    ac.innerHTML = "<h2>Water quality — needs attention</h2>" +
      flags.map(f=>`<div class="flag ${f.sev==="breach"?"":"warn"}">${esc(f.msg)}
        ${f.sev==="breach" && f.event ? `<button class="btn ghost" style="margin-top:8px;padding:8px" onclick="resolveAami(${f.event.id})">Mark resolved</button>` : ""}</div>`).join("");
  }
  // KPIs
  const overdue = MACHINES.filter(m=>machineState(m).level==="overdue");
  const due     = MACHINES.filter(m=>machineState(m).level==="due");
  document.getElementById("kpis").innerHTML = `
    <div class="kpi"><div class="n">${MACHINES.length}</div><div class="l">Machines</div></div>
    <div class="kpi"><div class="n" style="color:${due.length?"#8a6400":"var(--green)"}">${due.length}</div><div class="l">Due now</div></div>
    <div class="kpi"><div class="n" style="color:${overdue.length?"var(--red)":"var(--green)"}">${overdue.length}</div><div class="l">Overdue</div></div>`;
  // due list
  const dl = [...overdue, ...due].sort((a,b)=>machineState(b).days-machineState(a).days);
  document.getElementById("dueList").innerHTML = dl.length===0
    ? '<div class="okmsg">Everything current. Nice.</div>'
    : dl.map(m=>{const st=machineState(m);return `<div class="mrow" onclick="openDetail(${m.id})">
      <div class="id">${esc(m.label)}</div>
      <div style="flex:1"><div>${esc(st.label)}</div><div class="who">${esc(m.type)} · ${st.level==="due"?"due":"overdue by "+st.days+" d"}</div></div>
      <span class="badge ${st.level}">${st.level}</span></div>`}).join("");
  renderRecent();
}
/* Full machine log on the board: every machine, sorted newest first,
   filterable by machine. Shows ALL entries (paginated render at 400). */
function renderRecent(){
  const sel = document.getElementById("recentFilter");
  if(sel.options.length !== MACHINES.length + 1){
    sel.innerHTML = '<option value="all">All machines</option>' +
      MACHINES.map(m=>`<option value="${m.id}">${esc(m.label)}</option>`).join("");
  }
  const want = sel.value;
  const evs = EVENTS.filter(e=> want==="all" || String(e.machine_id)===want)
    .slice().sort((a,b)=> (b.event_date||"").localeCompare(a.event_date||"") || (b.id||0)-(a.id||0));
  const PAGE = 400;
  const shown = evs.slice(0, PAGE);
  const listEl = document.getElementById("recentList");
  listEl.innerHTML = evs.length===0 ? "No events logged yet."
    : shown.map(e=>{
        const m = MACHINES.find(x=>x.id===e.machine_id);
        const tp = TEMPLATES.find(x=>x.task_type===e.task_type);
        return eventRow(e, tp?tp.label:e.task_type, m?m.label:"?");
      }).join("") +
    (evs.length>PAGE ? `<div class="muted" style="margin-top:8px">Showing newest ${PAGE} of ${evs.length} — narrow the date filter or export CSV for the full archive.</div>` : "");
}
let _rfBound = false;
function bindRecentFilter(){ if(!_rfBound){ document.getElementById("recentFilter").addEventListener("change", renderRecent); _rfBound=true; } }
function eventRow(e, label, machineLabel){
  const ico = e.result==="fail" ? "✕" : (e.task_type.startsWith("culture")?"🧫":e.task_type.startsWith("pm")?"🔧":"✓");
  const v = e.values||{};
  const extras = Object.entries(v).filter(([k,val])=>val!==null&&val!=="")
    .map(([k,val])=>`${esc(k.replace(/_/g," ")).replace("uS","µS")}: <b>${esc(val)}</b>`).join(" · ");
  return `<div class="ev"><div class="icon ${e.result==="fail"?"fail":"pass"}">${ico}</div>
    <div class="body"><div>${esc(label)} — <b>${esc(machineLabel)}</b> ${e.result==="fail"?'<span class="badge overdue">FAIL</span>':""}
    ${extras?`<div class="who">${extras}</div>`:""}</div>
    <div class="who">${esc(e.event_date)} ${e.performed_by?"· "+esc(e.performed_by):""}</div>
    ${e.notes?`<div class="who">${esc(e.notes)}</div>`:""}</div></div>`;
}

/* ================= LOG ENTRY FORM ======================== */
const TASK_FIELDS = {
  
  
  pm_nxstage:           [["hours","Machine hours","number","min='0'"]],
  
  
  pm_full_crrt:         [["hours","Machine hours","number","min='0'"]],
  
  culture_effluent:     [["cfu_ml","Bacteria (CFU/mL)","number","min='0'"],
                         ["eu_ml","Endotoxin (EU/mL)","number","step='0.001' min='0'"],
                         ["site","Site","text","placeholder='effluent, dialysate port…'"]],
  pm_ccpd:              [["hours","Machine hours","number","min='0'"]],
  reading_conductivity: [["conductivity_uS","Conductivity (µS/cm)","number","step='0.1' min='0' max='200'"]],
  reading_hardness:     [["hardness_gpg","Hardness (gpg)","number","step='0.1' min='0'"]],
  culture_water:        [["cfu_ml","Bacteria (CFU/mL)","number","min='0'"],
                         ["eu_ml","Endotoxin (EU/mL)","number","step='0.001' min='0'"],
                         ["site","Site","text","placeholder='post-RO, delivery loop…'"]],
  culture_machine:      [["cfu_ml","Bacteria (CFU/mL)","number","min='0'"]],
  disinfect_bleach:     [["residual_ppm","Residual (ppm)","number","step='0.1' min='0'"]],
  pm_membrane:          [["hours","Membrane hours","number","min='0'"]],
  pm_uv_lamp:           [["lamp_hours","UV lamp hours","number","min='0'"]],
};
function renderLogForm(){
  const sel = document.getElementById("fMachine");
  sel.innerHTML = MACHINES.map(m=>`<option value="${m.id}">${esc(m.label)} — ${esc(m.type)}</option>`).join("")
    || '<option disabled>No machines yet — add one on the Machines tab</option>';
  const tsel = document.getElementById("fTask");
  tsel.innerHTML = TEMPLATES.map(t=>`<option value="${t.task_type}">${esc(t.label)}</option>`).join("");
  document.getElementById("fDate").value = new Date().toISOString().slice(0,10);
    document.getElementById("xFrom").value = new Date(Date.now()-90*86400000).toISOString().slice(0,10);
    document.getElementById("xTo").value = new Date().toISOString().slice(0,10);
  dynFields();
}
function dynFields(){
  const tt = document.getElementById("fTask").value;
  const wrap = document.getElementById("dynFields");
  wrap.innerHTML = "";   // reset - prevents field stacking on task change
  (TASK_FIELDS[tt]||[]).forEach(([k,label,type,attrs])=>{
    wrap.insertAdjacentHTML("beforeend",
      `<div><label for="f_${k}">${label}</label><input type="${type}" id="f_${k}" data-k="${k}" ${attrs||""}></div>`);
  });
}
document.getElementById("fTask").addEventListener("change", dynFields);

async function submitEvent(){
  const msg = document.getElementById("logMsg");
  const mid = +document.getElementById("fMachine").value;
  const tt  = document.getElementById("fTask").value;
  const date= document.getElementById("fDate").value;
  const time= document.getElementById("fTime").value;
  const by  = document.getElementById("fBy").value.trim();
  const notes = document.getElementById("fNotes").value.trim();
  if(!mid){ msg.textContent = "Add a machine first (Machines tab)."; return; }
  if(!tt){ msg.textContent = "Pick the task type (citric, bleach, culture…) before saving."; return; }
  if(!by){ msg.textContent = "Performed-by initials are required for the log."; return; }
  const values = {};
  document.querySelectorAll("#dynFields input").forEach(i=>{ if(i.value!=="") values[i.dataset.k] = parseVal(i.value); });
  const ev = {machine_id:mid, task_type:tt, event_date:date, performed_by:by, notes:notes||null};
  if(time) ev.event_time = time;
  ev.values = values;
  if(values.cfu_ml!=null && values.cfu_ml > AAMI.CFU_LIMIT){
    ev.result = "fail";
  } else if(values.conductivity_uS!=null && values.conductivity_uS > AAMI.COND_LIMIT){
    ev.result = "fail";
  }
  try{
    const [saved] = await apiPost(API.events, ev);
    // auto-create an action item for breaches
    if(saved.result === "fail"){
      await apiPost(API.actions, {event_id:saved.id, machine_id:mid,
        action_type:"aami_breach_retest",
        description:"Value exceeded AAMI limit — disinfect within 24h and re-culture/re-test.",
        due_by: new Date(Date.now()+86400000).toISOString().slice(0,10)});
    }
    msg.innerHTML = '<span style="color:var(--green)">Saved ✓</span>';
    ["fBy","fNotes"].forEach(id=>document.getElementById(id).value="");
    document.querySelectorAll("#dynFields input").forEach(i=>i.value="");
    EVENTS = await apiGet(API.events+"?select=*&order=id.desc&limit=2000");
    ACTIONS = await apiGet(API.actions+"?select=*&order=id.desc&limit=2000");
    setTimeout(()=>{ msg.textContent=""; show("dash"); }, 700);
  }catch(err){ msg.textContent = "Save failed: "+err.message; }
}
function parseVal(s){
  if(/^[-+]?\d+$/.test(s.trim())) return parseInt(s,10);
  const n = parseFloat(s); return isNaN(n)? s : n;
}

/* ================= MACHINES ======================== */
async function addMachine(){
  const msg = document.getElementById("mchMsg");
  const type = document.getElementById("mType").value;
  const label= document.getElementById("mLabel").value.trim();
  const model= document.getElementById("mModel").value.trim()||null;
  const loc  = document.getElementById("mLoc").value.trim()||null;
  if(!label){ msg.textContent = "Give it an ID, e.g. #7 or RO skid."; return; }
  try{
    await apiPost(API.machines, {type,label,model,location:loc});
    MACHINES = await apiGet(API.machines+"?select=*&active=eq.true&order=label");
    ["mLabel","mModel","mLoc"].forEach(id=>document.getElementById(id).value="");
    msg.innerHTML = '<span style="color:var(--green)">Machine added ✓</span>';
    renderMachines();
    renderLogForm();
  }catch(err){ msg.textContent = "Add failed: "+err.message; }
}
function renderMachines(){
  const el = document.getElementById("machineList");
  el.innerHTML = MACHINES.length===0 ? "No machines yet."
    : MACHINES.map(m=>{ const st=machineState(m);
      return `<div class="mrow" onclick="openDetail(${m.id})">
        <div class="id">${esc(m.label)}</div>
        <div style="flex:1"><div class="muted">${esc(m.type)} ${m.model?"· "+esc(m.model):""}</div>
        <div class="who">${st.level==="ok"?"All current":st.label+" — "+st.level}</div></div>
        <span class="badge ${st.level}">${st.level}</span></div>`;}).join("");
}

/* ================= MACHINE DETAIL + TIMELINE ======================== */
function openDetail(id){
  currentMachine = MACHINES.find(m=>m.id===id);
  if(!currentMachine) return;
  show("detail");
}
function renderDetail(){
  const m = currentMachine; if(!m) return;
  const tpls = TEMPLATES.filter(x=>x.machine_type===m.type);
  const evs = EVENTS.filter(e=>e.machine_id===m.id)
    .sort((a,b)=>(b.event_date||"").localeCompare(a.event_date||""));
  const st = machineState(m);
  const tl = tpls.map(x=>{
    const ev = lastEvent(m.id, x.task_type);
    const last = ev?ev.event_date:null;
    const age = last?daysSince(last):null;
    const due_in = last ? (x.interval_days-1-age) : null;
    const lvl = !last?"overdue":(due_in<0?(due_in<=-3?"overdue":"due"):"ok");
    return `<div class="ev"><div class="icon ${lvl==="ok"?"pass":"fail"}">${lvl==="ok"?"✓":"!"}</div>
      <div class="body"><div>${esc(x.label)}</div>
      <div class="who">${last?"last "+last+(age!=null?" ("+age+" d ago)":""):"never logged"}${x.interval_days?" · every "+x.interval_days+" d":""}</div></div>
      ${lvl!=="ok"?`<span class="badge ${lvl}">${lvl}</span>`:""}</div>`;
  }).join("");
  document.getElementById("view-detail").innerHTML = `
    <div class="card"><button class="btn ghost" onclick="show('dash')" style="padding:8px;margin-bottom:10px">← Board</button>
      <h2 style="margin-bottom:4px">${esc(m.label)}</h2>
      <p class="muted">${esc(m.type)} ${m.model?"· "+esc(m.model):""} ${m.location?"· "+esc(m.location):""}
      · ${MACHINES.length} machines total</p>
      ${st.level!=="ok"?`<div class="flag">${esc(st.label)} — ${st.level==="overdue"?"overdue by "+st.days+" days":"due"}</div>`:""}
      <h2 style="margin-top:14px">Interval clocks</h2>${tl}
      <h2 style="margin-top:16px">Timeline (${evs.length})</h2>
      ${evs.length?evs.map(e=>eventRow(e,(TEMPLATES.find(x=>x.task_type===e.task_type)||{}).label||e.task_type,"")).join(""):'<p class="muted">No events yet.</p>'}
    </div>`;
}

async function resolveAami(eventId){
  // mark the newest matching open action done
  const mine = ACTIONS.filter(a=>a.event_id===eventId && a.status==="open");
  if(!mine.length) return;
  for(const a of mine){
    await apiPatch(API.actions+"?id=eq."+a.id, {status:"done", resolved_at:new Date().toISOString()});
  }
  ACTIONS = await apiGet(API.actions+"?select=*&order=id.desc&limit=2000");
  renderDash();
}


function exportCSV(){
  const from = document.getElementById("xFrom").value || "0000-01-01";
  const to   = document.getElementById("xTo").value   || "9999-12-31";
  const evs = EVENTS.filter(e=>e.event_date>=from && e.event_date<=to)
    .sort((a,b)=>a.event_date.localeCompare(b.event_date));
  if(!evs.length){ alert("No events in that range."); return; }
  const q = (s)=>'"'+String(s==null?"":s).replace(/"/g,'""')+'"';
  let out = "date,machine_id,machine_label,type,task,result,performed_by,values,notes\n";
  for(const e of evs){
    const m = MACHINES.find(x=>x.id===e.machine_id)||{};
    const tp = TEMPLATES.find(x=>x.task_type===e.task_type);
    out += [e.event_date, e.machine_id, q(m.label||""), m.type||"", q((tp||{}).label||e.task_type),
            e.result||"", q(e.performed_by||""), q(JSON.stringify(e.values||{})), q(e.notes||"")].join(",")+"\n";
  }
  const blob = new Blob([out], {type:"text/csv"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "dialysis-log_" + from + "_to_" + to + ".csv";
  a.click();
}
